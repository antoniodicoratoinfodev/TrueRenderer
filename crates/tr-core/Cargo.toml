[package]
name = "tr-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file.workspace = true
[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
sha2.workspace = true
rayon = "=1.11.0"
moxcms = "=0.8.1"
uuid.workspace = true
# Already pinned through image/wgpu; safe byte views for private IPC buffers.
bytemuck = "=1.25.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"

# Unificata sull'intero grafo: sha2-asm non supporta Windows, nemmeno GNU.
# Su Windows si usa l'implementazione Rust.
[target.'cfg(not(target_os = "windows"))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }
